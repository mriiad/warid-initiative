name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Create test config.json
        # config.json is intentionally gitignored (it normally holds
        # per-environment secrets); src/middleware/token-check.js requires
        # it directly, so tests need a throwaway one with dummy values.
        # SECRET_KEY must match the JWT_SECRET_KEY set in
        # e2e/backend/support/jest.setup.js (see jwtHelper.js) or every
        # authenticated-route test fails with 401. JWT_EXPIRE must be
        # present (e2e/event.e2e.spec.js passes it straight through as
        # jwt.sign's `expiresIn`, which throws if given `undefined`).
        run: |
          cat > config.json <<'EOF'
          {
            "authConfig": {
              "SECRET_KEY": "test-jwt-secret-key-for-sandbox",
              "JWT_EXPIRE": "1h"
            },
            "mailerConfig": {
              "email": "test@example.com",
              "password": "test-password",
              "host": "localhost",
              "secureConnection": false,
              "port": 2525,
              "ciphers": "SSLv3",
              "requireTLS": false
            }
          }
          EOF

      - name: Run backend tests (mocked models)
        run: npm run test:e2e:backend

      - name: Run API e2e tests (real mongodb-memory-server)
        run: npm run test:e2e

  frontend-checks:
    name: Frontend typecheck, unit tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extranet
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run unit/component tests
        run: npm run test

      - name: Build production bundle
        run: npm run build

  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extranet
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: extranet/playwright-report/
          retention-days: 7

  # Single aggregate check so branch protection only needs to require one
  # status ("CI / all-checks-passed") instead of tracking each job by name.
  all-checks-passed:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-checks, frontend-e2e]
    if: always()
    steps:
      - name: Fail if any required job failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All required jobs passed."
